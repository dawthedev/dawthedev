    <g transform="translate(94,124)">
      <circle r="54" fill="none" stroke="#c9a227" stroke-opacity="0.55" stroke-width="1"/>
      <circle r="46" fill="none" stroke="#c9a227" stroke-opacity="0.22" stroke-width="0.7" stroke-dasharray="1.2 9"/>
      <path d="M0,-40L35,20L-35,20Z" fill="none" stroke="#e2cd93" stroke-opacity="0.65" stroke-width="1.1"/>
