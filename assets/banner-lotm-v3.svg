    <polygon points="0,-140 121,70 -121,70" fill="none" stroke="#c9a227" stroke-opacity="0.26" stroke-width="0.9"/>
    <polygon points="0,140 121,-70 -121,-70" fill="none" stroke="#c9a227" stroke-opacity="0.26" stroke-width="0.9"/>
    <g fill="#c9a227" fill-opacity="0.55">
