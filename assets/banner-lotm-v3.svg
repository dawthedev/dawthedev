    <path d="M742 70c6-7 15-10 20-10-4 4-6 8-6 12 5-3 11-4 16-3-5 5-9 9-11 14-4-3-9-6-14-8-3-2-4-3-5-5z"/>
    <path d="M1150 88c5-6 12-8 17-8-4 3-5 6-5 10 4-2 9-3 13-2-4 4-7 7-9 11-3-2-7-5-11-7-3-1-4-2-5-4z" opacity="0.8"/>
  </g>

  <g transform="translate(958,206)">
    <circle r="186" fill="url(#coreGlow)"/>
    <circle r="182" fill="none" stroke="#c9a227" stroke-opacity="0.14" stroke-width="1"/>
