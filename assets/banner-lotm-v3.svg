      <g stroke="#c9a227" stroke-opacity="0.5" stroke-width="0.8">
        <line x1="0" y1="-60" x2="0" y2="-50"/>
        <line x1="0" y1="50" x2="0" y2="60"/>
        <line x1="-60" y1="0" x2="-50" y2="0"/>
        <line x1="50" y1="0" x2="60" y2="0"/>
      </g>
      <g transform="translate(0,-6)">
        <path d="M-16 0q16-11 32 0-16 11-32 0z" fill="none" stroke="#e2cd93" stroke-opacity="0.9" stroke-width="1.1"/>
        <circle r="4.2" fill="none" stroke="#e2cd93" stroke-opacity="0.9" stroke-width="1"/>
        <circle r="1.6" fill="#e2cd93"/>
      </g>
    </g>

    <text x="94" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" letter-spacing="3.2" fill="#cbb98d" fill-opacity="0.8">THE ARTISAN</text>
  </g>

  <g fill="#0b0b0d" opacity="0.92">
    <path d="M1206 232c5-6 12-8 17-8-4 3-5 6-5 9 4-2 8-3 12-2-4 4-7 7-9 10-3-2-7-4-11-6-2-1-3-2-4-3z"/>
