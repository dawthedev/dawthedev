      <circle cx="172" cy="0" r="2"/>
      <circle cx="0" cy="172" r="2"/>
      <circle cx="-172" cy="0" r="2"/>
      <circle cx="121" cy="70" r="1.6"/>
      <circle cx="-121" cy="70" r="1.6"/>
      <circle cx="121" cy="-70" r="1.6"/>
      <circle cx="-121" cy="-70" r="1.6"/>
    </g>
  </g>

  <g transform="translate(1132,84)">
