    <text x="84" y="242" font-size="12.5" letter-spacing="3.4" fill="#cdbf9f">WEB DEVELOPER</text>
    <text x="84" y="264" font-size="12.5" letter-spacing="3.4" fill="#8f8268">LARAVEL &#183; BLADE &#183; MYSQL</text>

    <text x="84" y="300" font-size="15" fill="#9a8b6f" font-style="italic">Di balik kabut, kode mengambil bentuk.</text>

