<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DAW - Web Developer - Lord of the Mysteries styled banner">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="45%" stop-color="#0d0c0b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fbf3d5"/>
      <stop offset="32%" stop-color="#e2cd93"/>
      <stop offset="58%" stop-color="#c9a227"/>
      <stop offset="78%" stop-color="#a8842f"/>
      <stop offset="100%" stop-color="#e8d8a6"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0"/>
      <stop offset="18%" stop-color="#e2cd93" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#c9a227" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nameGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e2cd93" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e2cd93" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <radialGradient id="fogLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8b58a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c8b58a" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>

    <pattern id="lattice" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 0l14 14M14 0L0 14" stroke="#c9a227" stroke-opacity="0.16" stroke-width="0.7"/>
    </pattern>

    <pattern id="stars" width="86" height="86" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="0.9" fill="#e2cd93" fill-opacity="0.55"/>
      <circle cx="58" cy="63" r="0.7" fill="#e2cd93" fill-opacity="0.35"/>
      <circle cx="73" cy="22" r="0.6" fill="#e2cd93" fill-opacity="0.28"/>
      <circle cx="34" cy="79" r="0.5" fill="#e2cd93" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#ink)"/>
  <rect width="1280" height="420" fill="url(#stars)"/>

  <ellipse cx="1010" cy="205" rx="300" ry="250" fill="url(#fogLight)"/>

  <g opacity="0.5">
