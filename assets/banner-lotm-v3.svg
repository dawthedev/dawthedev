      <rect x="0" y="-14" width="72" height="26" rx="3" fill="#c9a227" fill-opacity="0.05" stroke="#c9a227" stroke-opacity="0.55"/>
      <text x="14" y="4">PHP</text>
      <rect x="82" y="-14" width="102" height="26" rx="3" fill="#c9a227" fill-opacity="0.05" stroke="#c9a227" stroke-opacity="0.55"/>
      <text x="96" y="4">LARAVEL</text>
      <rect x="194" y="-14" width="80" height="26" rx="3" fill="#c9a227" fill-opacity="0.05" stroke="#c9a227" stroke-opacity="0.55"/>
      <text x="208" y="4">BLADE</text>
      <rect x="284" y="-14" width="80" height="26" rx="3" fill="#c9a227" fill-opacity="0.05" stroke="#c9a227" stroke-opacity="0.55"/>
      <text x="298" y="4">MYSQL</text>
    </g>
  </g>

  <g stroke="#c9a227" fill="none">
    <rect x="16" y="16" width="1248" height="388" stroke-opacity="0.30" stroke-width="1.1"/>
    <rect x="24" y="24" width="1232" height="372" stroke-opacity="0.14" stroke-width="0.8"/>

    <g stroke-opacity="0.55" stroke-width="1.2">
