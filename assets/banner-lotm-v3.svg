  <g transform="translate(1014,110) rotate(-6)">
    <rect x="0" y="0" width="188" height="248" rx="7" fill="#0d0c0a" stroke="url(#gold)" stroke-width="1.6"/>
    <rect x="0" y="0" width="188" height="248" rx="7" fill="url(#lattice)"/>
    <rect x="8" y="8" width="172" height="232" rx="4" fill="none" stroke="#c9a227" stroke-opacity="0.42" stroke-width="0.9"/>
    <rect x="13" y="13" width="162" height="222" rx="3" fill="none" stroke="#c9a227" stroke-opacity="0.20" stroke-width="0.7"/>

    <g stroke="url(#goldLine)" stroke-width="1">
