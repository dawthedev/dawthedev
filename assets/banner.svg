<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Dwi Andika - Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="nameClip">
      <text x="80" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" letter-spacing="-1">Dwi Andika</text>
    </clipPath>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="1080" cy="60" rx="360" ry="220" fill="#6366f1" opacity="0.16"/>
  <ellipse cx="120" cy="360" rx="300" ry="180" fill="#22d3ee" opacity="0.10"/>
  <rect x="0" y="392" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="'Consolas', 'SFMono-Regular', ui-monospace, monospace" font-size="14" fill="#7c8db5">
    <circle cx="34" cy="34" r="6" fill="#f87171"/>
    <circle cx="56" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="78" cy="34" r="6" fill="#34d399"/>
    <text x="100" y="39" fill="#64748b">~/dwiandikaw95-sys — zsh</text>
  </g>

  <g filter="url(#glow)">
    <rect x="80" y="196" width="440" height="4" fill="url(#accent)" opacity="0.9" clip-path="url(#nameClip)" transform="translate(0,-140)"/>
  </g>

  <text x="80" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" letter-spacing="-1" fill="url(#accent)">Dwi Andika</text>
  <text x="82" y="240" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Web Developer · Laravel · Blade · Figma</text>

  <g font-family="'Consolas', ui-monospace, monospace" font-size="17" fill="#94a3b8">
    <text x="82" y="300"><tspan fill="#34d399">$</tspan> whoami</text>
    <text x="82" y="330"><tspan fill="#64748b">&gt;</tspan> mahasiswa informatika, membangun web dari desain sampai deploy</text>
  </g>

  <g transform="translate(80,352)">
    <g font-family="'Consolas', ui-monospace, monospace" font-size="13" fill="#0b1220">
      <rect x="0" y="-16" width="92" height="26" rx="13" fill="#60a5fa"/>
      <text x="18" y="2" fill="#0b1220" font-weight="700">PHP</text>
      <rect x="104" y="-16" width="118" height="26" rx="13" fill="#a78bfa"/>
      <text x="122" y="2" fill="#0b1220" font-weight="700">Laravel</text>
      <rect x="234" y="-16" width="96" height="26" rx="13" fill="#34d399"/>
      <text x="252" y="2" fill="#0b1220" font-weight="700">Blade</text>
      <rect x="342" y="-16" width="92" height="26" rx="13" fill="#fbbf24"/>
      <text x="360" y="2" fill="#0b1220" font-weight="700">Figma</text>
    </g>
  </g>

  <g transform="translate(920,120)" opacity="0.5">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="150" font-weight="700" fill="url(#fade)">&lt;/&gt;</text>
  </g>
</svg>
