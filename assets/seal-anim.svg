<svg xmlns="http://www.w3.org/2000/svg" width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Seal of DAW">
  <defs>
    <radialGradient id="wax" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="55%" stop-color="#1d170f"/>
      <stop offset="100%" stop-color="#0b0a08"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e7c3"/>
      <stop offset="45%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6d21"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <circle cx="66" cy="66" r="58" fill="#c9a227" fill-opacity="0.10" filter="url(#glow)">
    <animate attributeName="fill-opacity" values="0.05;0.22;0.05" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="66" cy="66" r="52" fill="url(#wax)" stroke="url(#rim)" stroke-width="1.6"/>
  <circle cx="66" cy="66" r="45" fill="none" stroke="#c9a227" stroke-opacity="0.45" stroke-width="0.9" stroke-dasharray="1.4 6">
    <animateTransform attributeName="transform" type="rotate" from="0 66 66" to="360 66 66" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="66" r="36" fill="none" stroke="#c9a227" stroke-opacity="0.30" stroke-width="0.8"/>

  <g stroke="#e2cd93" stroke-opacity="0.55" stroke-width="0.8" fill="none">
    <line x1="66" y1="9" x2="66" y2="15"/>
    <line x1="66" y1="117" x2="66" y2="123"/>
    <line x1="9" y1="66" x2="15" y2="66"/>
    <line x1="117" y1="66" x2="123" y2="66"/>
  </g>

  <text x="66" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="url(#rim)" letter-spacing="1">D</text>
  <text x="66" y="101" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="7" letter-spacing="2.6" fill="#b9a271" fill-opacity="0.85">XIII
    <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
